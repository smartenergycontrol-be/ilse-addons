name: ILSE S2 Gateway
version: "0.4.0"
slug: ilse_s2_gateway
description: Expose Home Assistant devices as S2 (EN 50491-12-2) resource managers to an external energy manager. Read-only shadow mode.
url: https://github.com/smartenergycontrol-be/ilse-addons/tree/main/s2_gateway
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:transit-connection-variant
panel_title: S2 Gateway
options:
  cem_url: "ws://127.0.0.1:8003/ws/{rm_id}"
  self_test_cem: true
  self_test_every_min: 0
  interval_s: 30
  devices:
    - name: battery
      type: battery
      soc_entity: sensor.battery_soc
      power_entity: sensor.battery_power
      power_factor: 1
      capacity_kwh: 10
      max_charge_w: 5000
      max_discharge_w: 5000
schema:
  site_name: str?
  cem_url: str
  self_test_cem: bool
  self_test_every_min: int(0,1440)
  interval_s: int(5,600)
  devices:
    - name: str
      type: list(battery|ev|switch|pv)
      label: str?
      icon: list(battery|inverter|charger|car|boiler|switch|pv)?
      soc_entity: str?
      power_entity: str?
      power_factor: float?
      state_entity: str?
      capacity_kwh: float?
      max_charge_w: int?
      max_discharge_w: int?
      power_w: int?
      plugged_entity: str?
      plugged_state: str?
      min_charge_w: int?
      target_soc: int(0,100)?
      departure: str?
